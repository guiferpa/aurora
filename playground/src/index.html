<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Playground</title>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;
        flex-direction: row;
        gap: 10px;
        height: 100vh;
        width: 100vw;
        padding: 8px;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 10;
      }
      #loading.hidden {
        display: none;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .text {
        color: #666;
        font-size: 14px;
      }
      button:hover {
        cursor: pointer;
      }
      #editor {
        background-color: #1e1e1e;
        width: 70%;
      }
      #actions {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 30%;
        gap: 10px;
      }
      #info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ccc;
        flex: 1;
        padding: 10px;
      }
      #output {
        display: flex;
        list-style: none;
        flex: 21;
        padding: 4px;
        overflow-y: auto;
        flex-direction: column;
      }
      #output > li {
        padding: 4px;
      }
      #output > li:hover {
        cursor: pointer;
        background-color: #F2F2F2;
      }
      #controls {
        display: flex;
        gap: 4px;
        flex: 2;
      }
      #runner, #clear {
        width: 100%;
        height: 100%;
      }

      #runner {
        flex: 3;
      }

      #clear {
        flex: 1;
      }
      #output > li.error {
        color: #ff0000;
      }
      #settings {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #debug-mode-label, #tape-size-label {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
      }
      #debug-mode-label:hover, #tape-size-label:hover {
        cursor: pointer;
      }
      #tape-size {
        font: inherit;
        padding: 2px;
      }
      #divider {
        width: 1px;
        cursor: col-resize;
        background-color: #ccc;
      }
      #divider:hover {
        background-color: #444;
      }
    </style>
  </head>

  <body>
    <!--
	Add the following polyfill for Microsoft Edge 17/18 support:
	<script src="https://cdn.jsdelivr.net/npm/text-encoding@0.7.0/lib/encoding.min.js"></script>
	(see https://caniuse.com/#feat=textencoder)
	-->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

    <script>
      require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" }});
      require(["vs/editor/editor.main"], function () {
        // Registering the language has to happen once the loader has answered, and before
        // anything is configured for it: it used to sit after this call, where monaco does
        // not exist yet, so nothing was ever registered at all.
        monaco.languages.register({ id: "aurora" });

        window.editor = monaco.editor.create(document.getElementById('editor'), {
          value: "printc \"Hello, World!\";",
          language: "aurora",
          theme: "vs-dark",
          automaticLayout: true,
          padding: {
            top: 16,
            bottom: 16,
          },
          minimap: {
            enabled: false,
          },
        });

        const $loading = document.getElementById('loading');
        if ($loading) {
            $loading.classList.add('hidden');
        }

        // Monaco arrives through its own loader, so the modules below cannot know when the
        // editor exists. This is how they are told.
        document.dispatchEvent(new CustomEvent('editor-ready'));
      });
    </script>
    <script src="wasm_exec.js"></script>
    <script type="module" src="resize.js"></script>
    <script type="module" src="main.js"></script>

    <div class="container">
      <div id="editor">
        <div id="loading">
          <div class="spinner"></div>
          <div class="text">Loading editor...</div>
        </div>
      </div>
      <div id="divider"></div>
      <div id="actions">
        <div id="info">
          <span id="version"></span>
          <div id="settings">
            <!--
              Bytes per value. Every value in Aurora is a tape this wide, so the width
              decides what a program means: at one byte 255 + 1 is 0, and text only fits
              while it is shorter than a tape.

              The value of each option is what the compiler reads, and it has to stay a bare
              number: the unit belongs in the label. A value of "32 bytes" is not a size, and
              the reader falls back to the default rather than failing — so the control would
              go on looking right while every width compiled at 32.
            -->
            <label id="tape-size-label" for="tape-size" title="Bytes per value: every value is a tape this wide">
              <span id="tape-size-text">Tape</span>
              <select id="tape-size">
                <option value="1">1 byte</option>
                <option value="2">2 bytes</option>
                <option value="4">4 bytes</option>
                <option value="8">8 bytes</option>
                <option value="16">16 bytes</option>
                <option value="32" selected>32 bytes</option>
              </select>
            </label>
            <label id="debug-mode-label" for="debug-mode">
              <input type="checkbox" id="debug-mode">
              <span id="debug-mode-text">Debug</span>
            </label>
          </div>
        </div>
        <ul id="output"></ul>
        <div id="controls">
          <button id="runner" disabled>Run</button>
          <button id="clear" disabled>Clear</button>
        </div>
      </div>
    </div>
  </body>
</html>
