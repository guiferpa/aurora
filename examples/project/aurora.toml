# Project manifest.
#
# A profile groups the paths and settings a command needs, so you can say
# "aurora run" instead of repeating them. The manifest lives at the root of the
# project; commands walk up from the working directory until they find it.
#
# Reference: ../../docs/manifest.md

[project]
  name = "aurora-example-project"
  version = "0.1.0"
  # Bytes per value, for the whole project: the dialect its source is written in.
  # Optional, 8 by default, and --tape-size wins over it for a single run.
  # tape_size = 16

[profiles]
  # "main" is what you get when no profile is named.
  [profiles.main]
    source = "src/main.ar"
    binary = "bin/main"
    # What deploy and call need, and what this file must not hold. A value written as
    # ${{ NAME }} is read from .env beside this file, or from the environment the command
    # runs in when .env does not have it — so a manifest can be tracked and a key cannot.
    #
    # A name nothing sets is refused rather than read as empty, so these are left commented
    # out: this project is built and run by the test suite, and it deploys nowhere.
    # rpc = "${{ AURORA_RPC }}"
    # privkey = "${{ AURORA_PRIVKEY }}"

  # A project holds as many profiles as it has things to build. This one is a
  # second program with a binary of its own.
  [profiles.label]
    source = "src/label.ar"
    binary = "bin/label"
