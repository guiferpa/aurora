name: Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.23', '1.24']
    name: Go ${{ matrix.go }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go }}

      - name: Install dependencies
        run: go mod download

      - name: Running test
        run: go test $(go list ./... | grep -v examples) -race -covermode atomic -coverprofile=covprofile

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: covprofile

  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version installed by the Makefile's $(LINTER) target.
          version: v2.7.2
          # Same arguments as "make lint", so local and CI agree.
          args: ./... --timeout 10m

