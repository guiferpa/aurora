# Project manifest.
#
# A profile groups the paths and settings a command needs, so you can say
# "aurora run" instead of repeating them. The manifest lives at the root of the
# project; commands walk up from the working directory until they find it.
#
# Reference: ../../docs/manifest.md

[project]
  name = "aurora-example-project"
  version = "0.1.0"
  # Bytes per value, for the whole project: the dialect its source is written in.
  # Optional, 8 by default, and --tape-size wins over it for a single run.
  # tape_size = 16

[profiles]
  # "main" is what you get when no profile is named.
  [profiles.main]
    source = "src/main.ar"
    binary = "bin/main"

  [profiles.tiny]
    source = "src/tiny.ar"
    binary = "bin/tiny"
